Comment: Created with Recipe Robot v2.2.0 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of Authentic8 and imports it into Munki.
Identifier: com.github.macjustice.munki.Authentic8
ParentRecipe: com.github.macjustice.download.Authentic8
MinimumVersion: 1.0.0

Input:
  NAME: Authentic8
  MUNKI_REPO_SUBDIR: apps/%NAME%
  pkginfo:
    catalogs:
    - testing
    description: 'Silo is a secure and anonymous web browsing solution that enables investigators and analysts to conduct research, collect evidence, and analyze data across the open, deep, and dark web.'
    developer: Authentic8 Inc.
    display_name: Authentic8
    name: '%NAME%'
    unattended_install: true

Process:
- Processor: MunkiImporter
  Arguments:
    pkg_path: '%pathname%'
    repo_subdirectory: '%MUNKI_REPO_SUBDIR%'
