Comment: Created with Recipe Robot v2.2.0 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of Authentic8.
Identifier: com.github.macjustice.download.Authentic8
MinimumVersion: 1.0.0

Input:
  NAME: Authentic8

Process:
- Processor: URLDownloader
  Arguments:
    filename: '%NAME%.dmg'
    url: https://www.authentic8.com/download/mac/

- Processor: EndOfCheckPhase

- Processor: CodeSignatureVerifier
  Arguments:
    input_path: '%pathname%/Authentic8.app'
    requirement: anchor apple generic and identifier "com.authentic8.launcher" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "9JX824QDWB")

- Processor: Versioner
  Arguments:
    input_plist_path: '%pathname%/Authentic8.app/Contents/Info.plist'
    plist_version_key: CFBundleShortVersionString
