Comment: Created with Recipe Robot v2.2.0 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of JetBrains Toolbox for Apple Silicon-based Macs.
Identifier: com.github.macjustice.download.JetBrainsToolboxAppleSilicon
MinimumVersion: 1.0.0

Input:
  NAME: JetBrains Toolbox

Process:
- Processor: URLDownloader
  Arguments:
    filename: '%NAME%.dmg'
    url: https://download.jetbrains.com/product?code=tba&latest&distribution=macM1

- Processor: EndOfCheckPhase

- Processor: CodeSignatureVerifier
  Arguments:
    input_path: '%pathname%/JetBrains Toolbox.app'
    requirement: identifier "com.jetbrains.toolbox" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "2ZEFAR8TH3"

- Processor: Versioner
  Arguments:
    input_plist_path: '%pathname%/JetBrains Toolbox.app/Contents/Info.plist'
    plist_version_key: CFBundleShortVersionString
