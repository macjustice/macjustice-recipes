Comment: Created with Recipe Robot v2.2.0 (https://github.com/homebysix/recipe-robot)
Description: Downloads the latest version of JetBrains Toolbox and imports it into Munki.
Identifier: com.github.macjustice.munki.JetBrainsToolboxIntel
ParentRecipe: com.github.macjustice.download.JetBrainsToolboxIntel
MinimumVersion: 1.0.0

Input:
  NAME: JetBrains Toolbox
  MUNKI_REPO_SUBDIR: apps/%NAME%
  pkginfo:
    catalogs:
    - testing
    description: ' '
    developer: JetBrains s.r.o.
    display_name: JetBrains Toolbox
    name: '%NAME%'
    unattended_install: true

Process:
- Processor: MunkiImporter
  Arguments:
    pkg_path: '%pathname%'
    repo_subdirectory: '%MUNKI_REPO_SUBDIR%'
